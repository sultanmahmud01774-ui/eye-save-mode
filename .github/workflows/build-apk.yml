name: Build Eye Save Mode Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK (GitHub Actions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew clean testDebugUnitTest assembleDebug --no-daemon --stacktrace
        env:
          JAVA_OPTS: "-Djava.awt.headless=true -Xmx4g"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false"
      - name: Verify APK output
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eye-save-mode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
